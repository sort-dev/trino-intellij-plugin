// Run 261-compiled classes on a newer SDK using the documented compile/instrument exclusions.
allprojects {
    afterEvaluate {
        def pluginIds = tasks.named('prepareTestSandbox').get().sandboxSystemDirectory.file('plugins/pluginsXMLIds.json')
        tasks.named('test') {
            classpath = classpath.filter { !(it.name.startsWith('jackson-') && it.name.endsWith('-2.16.1.jar')) }
            doFirst {
                def cache = pluginIds.get().asFile
                cache.parentFile.mkdirs()
                cache.text = '[]'
            }
        }
    }
}
